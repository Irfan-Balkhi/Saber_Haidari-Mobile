<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="images/favicon.svg"><link rel="stylesheet" href="css/style.css"><title>Shop – {shop}</title></head>
<body data-page="shop"><header id="site-header"></header>
<main><div class="page-top wrap"><span class="eyebrow">Shop</span><h1>Find your <span class="grad-text">perfect device</span></h1></div>
<section style="padding-top:30px"><div class="wrap">
 <div class="tools"><div class="chips" id="chips"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><input id="search" type="search" placeholder="Search products…"><select id="sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div></div>
 <p class="muted" id="count" style="margin-bottom:18px"></p>
 <div class="grid" id="grid"></div></div></section></main>
<footer id="site-footer"></footer>
<script src="js/config.js"></script><script src="js/products.js"></script><script src="js/main.js"></script><script src="js/shop.js"></script></body></html>
